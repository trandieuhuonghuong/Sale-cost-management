<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>SalesCost Pro - Quản lý chi phí bán hàng</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">SC</div><div><strong>SalesCost Pro</strong><span>Sales Expense Manager</span></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-card"><b>Tiến độ hồ sơ tháng 8</b><p>82% hồ sơ đã hoàn thiện</p><div class="progress"><i></i></div></div>
      <div class="profile"><div class="avatar">TH</div><div><b>Trần Diệu Hương</b><span>Quản trị viên</span></div></div>
    </aside>

    <main class="main">
      <header>
        <button class="menu-btn" id="menuBtn">☰</button>
        <div><h1 id="pageTitle">Tổng quan</h1><p id="pageSubtitle">Quản lý và kiểm soát toàn bộ chi phí bán hàng</p></div>
        <div class="header-actions">
          <input id="globalSearch" class="search" placeholder="Tìm kiếm trong trang..." />
          <button class="btn secondary" id="exportBtn">Xuất dữ liệu</button>
          <button class="btn primary" id="createBtn">＋ Tạo mới</button>
        </div>
      </header>
      <section id="app" class="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head"><div><h2 id="modalTitle">Tạo bản ghi mới</h2><p id="modalHint">Nhập thông tin và lưu vào hệ thống.</p></div><button class="close-btn" id="closeModal">✕</button></div>
      <form id="recordForm" class="form-grid"></form>
      <div class="modal-actions"><button class="btn secondary" id="cancelModal" type="button">Hủy</button><button class="btn primary" id="saveRecord" type="button">Lưu bản ghi</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
